name: CI (pull request)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  verificar:
    name: Build, pruebas y cdk synth
    runs-on: ubuntu-latest
    env:
      CF_STUDENT: ${{ vars.CF_STUDENT }}
      CF_ENV: dev
      CDK_DEFAULT_ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
      CDK_DEFAULT_REGION: ${{ vars.AWS_REGION }}
      CF_GITHUB_REPO: ${{ github.repository }}
      CF_NAG: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: Compilar
        run: npm run build -w infra -w apps/api -w apps/precalificacion -w apps/worker

      - name: Pruebas
        run: npm test -w infra -w apps/api -w apps/precalificacion -w apps/worker

      - name: Sintetizar con cdk-nag
        working-directory: infra
        run: npx cdk synth --quiet

      - name: Guardar plantillas
        uses: actions/upload-artifact@v4
        with:
          name: cdk-out
          path: infra/cdk.out/*.template.json
          retention-days: 7
